<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9e07a"/>
      <stop offset="50%" style="stop-color:#e9c46a"/>
      <stop offset="100%" style="stop-color:#c9a84c"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#c8bc6a"/>
      <stop offset="45%" style="stop-color:#f0ebc8"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>

  <g transform="translate(50,50)">
    <!-- Petali grandi -->
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="url(#petalGrad)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="url(#petalGrad)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="url(#petalGrad)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="url(#petalGrad)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="url(#petalGrad)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="url(#petalGrad)" transform="rotate(300)"/>
    <!-- Bordi oro grandi -->
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="none" stroke="#c9a84c" stroke-width="0.8" transform="rotate(0)" opacity="0.7"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="none" stroke="#c9a84c" stroke-width="0.8" transform="rotate(60)" opacity="0.7"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="none" stroke="#c9a84c" stroke-width="0.8" transform="rotate(120)" opacity="0.7"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="none" stroke="#c9a84c" stroke-width="0.8" transform="rotate(180)" opacity="0.7"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="none" stroke="#c9a84c" stroke-width="0.8" transform="rotate(240)" opacity="0.7"/>
    <ellipse cx="0" cy="-26" rx="7" ry="16" fill="none" stroke="#c9a84c" stroke-width="0.8" transform="rotate(300)" opacity="0.7"/>
    <!-- Petali interni -->
    <ellipse cx="0" cy="-19" rx="5" ry="11" fill="url(#petalGrad)" transform="rotate(30)" opacity="0.9"/>
    <ellipse cx="0" cy="-19" rx="5" ry="11" fill="url(#petalGrad)" transform="rotate(90)" opacity="0.9"/>
    <ellipse cx="0" cy="-19" rx="5" ry="11" fill="url(#petalGrad)" transform="rotate(150)" opacity="0.9"/>
    <ellipse cx="0" cy="-19" rx="5" ry="11" fill="url(#petalGrad)" transform="rotate(210)" opacity="0.9"/>
    <ellipse cx="0" cy="-19" rx="5" ry="11" fill="url(#petalGrad)" transform="rotate(270)" opacity="0.9"/>
    <ellipse cx="0" cy="-19" rx="5" ry="11" fill="url(#petalGrad)" transform="rotate(330)" opacity="0.9"/>
    <!-- Capolino oro -->
    <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="7.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <circle cx="0"  cy="-5" r="1.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="4"  cy="-3" r="1.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="4"  cy="3"  r="1.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="0"  cy="5"  r="1.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="-4" cy="3"  r="1.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="-4" cy="-3" r="1.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="0"  cy="0"  r="2"   fill="rgba(255,255,255,0.6)"/>
  </g>
</svg>
